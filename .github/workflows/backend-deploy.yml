# Deploy: build the backend image, push to ACR, update the Azure Container App.
# Runs on push to main. Requires repo secrets:
#   AZURE_CREDENTIALS  (service principal JSON from `az ad sp create-for-rbac --sdk-auth`)
#   ACR_NAME           (Azure Container Registry name, no domain)
#   RESOURCE_GROUP     (the single resource group holding all resources)
#   CONTAINER_APP      (Azure Container App name)
name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "ml/**", ".github/workflows/backend-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image qtdhgnn-backend:${{ github.sha }} \
            --image qtdhgnn-backend:latest \
            --file backend/Dockerfile .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/qtdhgnn-backend:${{ github.sha }}
